# /etc/nginx/sites-available/superflats.in (symlinked into sites-enabled). certbot adds the HTTPS servers.
server {
    listen 80;
    listen [::]:80;
    server_name superflats.in www.superflats.in;

    # Profile and property photos are uploaded through the site
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Streaming (React Suspense) needs unbuffered responses
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
